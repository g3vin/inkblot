# typeshare maps our two escape-hatch aliases per language; everything else it
# derives from the Rust definitions in src/types/.
#
# Swift's AnyCodable is not in the standard library — the Phase 5 Xcode target
# supplies it (e.g. Flight-School/AnyCodable). It is only reachable from the three
# places the format is genuinely untyped: TipTap content and the preserved
# unknown-key maps.

[typescript.type_mappings]
JsonValue = "unknown"
JsonMap = "Record<string, unknown>"

[swift.type_mappings]
JsonValue = "AnyCodable"
JsonMap = "[String: AnyCodable]"

[swift]
# Codable is always emitted; listing it here would duplicate the conformance and
# Swift rejects that.
default_decorators = ["Equatable"]
