[workspace]
members = ["crates/*"]

# Shared by every package in the workspace; each inherits with `field.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
authors = ["Gavin Bowden"]
license = "LicenseRef-Proprietary"
repository = "https://github.com/g3vin/inkblot"
publish = false

# Shared by the member crates, so a version bump lands in all of them at once.
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
# float_roundtrip: without it serde_json's float parser is off by up to 1 ULP, so a
# canvas coordinate changes in its last bit every time a document is loaded — and the
# parity harness reports it as a diff-engine mismatch. Caught by tests/parity.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
url = "2.5.8"
regex = "1.11"
# fancy-regex, not regex, for the search matcher: `regex` rejects backreferences and
# lookaround outright, so a user's `(?=...)` would come back as "Invalid pattern".
fancy-regex = "0.14"
once_cell = "1.19"
font-kit = "0.14"
# The #[typeshare] attribute itself is a no-op proc macro; the `typeshare` CLI reads
# the annotations out of the source. See crates/inkblot-core/typeshare.toml.
typeshare = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "gzip", "brotli", "deflate"] }

[package]
name = "inkblot"
description = "Inkblot, the Tauri app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "inkblot_lib"

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = { workspace = true }
inkblot-core = { path = "crates/inkblot-core" }
# The synonym model, Kokoro, whisper dictation and the scrape channel. The
# `*_commands.rs` modules are the Tauri glue over it.
inkblot-models = { path = "crates/inkblot-models", features = ["metal"] }
url = { workspace = true }
# reference_commands.rs: fetching a source's page for the References panel.
serde = { workspace = true }
reqwest = { workspace = true }

tauri = { version = "2.10.0", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-fs = "2.4.5"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"

# NSHapticFeedbackManager. WKWebView exposes no haptics API, so the trackpad can
# only be driven from native code.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# trackpad.rs: the NSEvent monitor's handler is a block.
block2 = "0.6"
