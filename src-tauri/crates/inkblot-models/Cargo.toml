[package]
name = "inkblot-models"
description = "Inkblot's on-device models (synonyms, rhymes, Kokoro speech, whisper dictation), independent of any shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["dictation"]
# whisper.cpp, built by cmake. Its own feature so a target it does not build for
# (iOS) can leave it out without losing the other models.
dictation = ["dep:inkblot-dictation", "dep:cpal"]
metal = ["inkblot-dictation?/metal"]

[dependencies]
inkblot-core = { path = "../inkblot-core" }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
log = "0.4"
ndarray = "0.17.2"
ort = { version = "2.0.0-rc.11", features = ["ndarray"] }
# No `http`: the tokenizer is always read from a file, and the http feature is what
# made the first use of synonyms need the network.
tokenizers = "0.23"
parking_lot = "0.12"
tokio = { version = "1", features = ["time", "sync", "rt"] }
cpal = { version = "0.17.3", optional = true }
inkblot-dictation = { git = "https://github.com/g3vin/inkblot-dictation.git", branch = "main", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["time", "sync", "rt", "macros"] }
