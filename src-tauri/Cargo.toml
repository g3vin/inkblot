[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
ndarray = "0.17.2"
ort = { version = "2.0.0-rc.11", features = ["ndarray"] }
once_cell = "1.19"
tokenizers = { version = "0.15", features = ["http"] }
parking_lot = "0.12"
cpal = "0.17.3"
inkblot-dictation = { git = "https://github.com/g3vin/inkblot-dictation.git", branch = "main", features = ["metal"] }


tauri = { version = "2.10.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2.4.5"
tauri-plugin-dialog = "2.6.0"

url = "2.5.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "gzip", "brotli", "deflate"] }
tauri-plugin-opener = "2"
